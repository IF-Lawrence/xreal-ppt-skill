<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[必填] 替换为 PPT 标题 · Deck Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
  /* ============ XREAL 品牌字体 · 本地优先 ============ */
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Thin.otf") format("opentype");font-weight:100;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Heavy.otf") format("opentype");font-weight:800;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-Ultra.otf") format("opentype");font-weight:900;font-style:normal;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-ThinItalic.otf") format("opentype");font-weight:100;font-style:italic;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-LightItalic.otf") format("opentype");font-weight:300;font-style:italic;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-RegularItalic.otf") format("opentype");font-weight:400;font-style:italic;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-MediumItalic.otf") format("opentype");font-weight:500;font-style:italic;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-BoldItalic.otf") format("opentype");font-weight:700;font-style:italic;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-HeavyItalic.otf") format("opentype");font-weight:800;font-style:italic;font-display:swap}
  @font-face{font-family:"XREAL Diatype";src:url("assets/fonts/XREALDiatype-UltraItalic.otf") format("opentype");font-weight:900;font-style:italic;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-Thin.otf") format("opentype");font-weight:100;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-ExtraLight.otf") format("opentype");font-weight:200;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-Light.otf") format("opentype");font-weight:300;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-Regular.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-Text.otf") format("opentype");font-weight:450;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-Medium.otf") format("opentype");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-SemiBold.otf") format("opentype");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Sans SC";src:url("assets/fonts/IBMPlexSansSC-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}

  :root{
    /* ============ 固定主题色: XREAL 黑白灰体系 ============
       主题变量只在此处定义,其他散落的 var() 引用无需逐处改 */
    --paper:#ffffff;          /* 主底色: XREAL 纯白 */
    --paper-rgb:255,255,255;
    --ink:#0a0a0a;            /* 文字主色: 近黑 */
    --ink-rgb:10,10,10;
    --pure-black:#000000;      /* 封面 / 封底黑色区域 */
    --grey-1:#f2f3f4;         /* 浅灰底 */
    --grey-2:#d6dade;         /* 中灰(分割线) */
    --grey-3:#667085;         /* 暗灰(辅助文字) */
    --accent:#0a0a0a;         /* 结构锚点: XREAL 黑色 */
    --accent-rgb:10,10,10;
    --accent-on:#ffffff;      /* accent 上的反色文字 */
    --accent-bright:#303030;  /* 黑色结构锚点的次级层 */
    --brand-red:#D71920;      /* XREAL 关键数据/警示语义，默认不启用 */
    --brand-silver:#A7ADB4;   /* XREAL 技术质感语义，默认不启用 */
    --brand-gold:#B08D57;     /* XREAL 品牌价值语义，默认不启用 */
    --radius-sm:8px;          /* 内容容器 / 色块 / 图片 / 控件统一小圆角 */
    --unit-mark-opacity:.62;  /* 展示级数值单位的统一中性对比度 */
    --unit-mark-gap:.18em;    /* in / Hz / ms / % 等文字单位与数字的间距 */
    --unit-degree-gap:.03em;  /* ° 与数字紧邻但不粘连 */
    --brief-card-pad:2.2vh;   /* S16 微卡四边统一内边距 */
    --sub-card-pad:2.2vh;     /* S04 六宫格卡片四边统一内边距 */
    --media-scrim-alpha:.38;  /* 文字叠加 full-bleed 媒体时的统一深色蒙版 */
    --chart-safe-inline:max(28px,1.9vw); /* S23 首末柱不得贴边或被裁切 */
    --chart-value-headroom:max(24px,2.8vh); /* 为柱顶数值预留独立空间 */
    --line-chart-safe-inline:max(36px,2.6vw); /* S24 端点、圆点与终值标签的安全区 */
    --chart-series-1:#0a0a0a; /* 主系列：近黑 */
    --chart-series-2:#525252; /* 次系列：中性深灰 */
    --chart-series-3:#a3a3a3; /* 第三系列：中性浅灰 */
    --chart-series-4:#d6dade; /* 第四系列：最浅灰 */
    --chart-critical:#D71920; /* 仅明确关键结论使用 */
    --chart-track:#f2f3f4;
    --chart-grid:#e0e0e0;
    --chart-frame:#a3a3a3;

    /* ============ Carbon 文本角色 token (role-based,代替 opacity) ============
       亮底:  primary 主文 / secondary 次文 / helper 辅助 / placeholder 占位
       暗底:  inverse 自动反向 */
    --text-primary:#0a0a0a;        /* = ink, 100% */
    --text-secondary:#525252;      /* gray 70 */
    --text-helper:#737373;         /* gray 60 */
    --text-placeholder:#a3a3a3;    /* gray 40 */
    --text-on-color:#ffffff;       /* accent/dark 反色 */
    --border-subtle:#e0e0e0;       /* gray 20, 极细分隔 */
    --border-strong:#a3a3a3;       /* gray 40, 强分隔 */

    /* ============ 字体：按整套 deck 的语言语境选择 ============
       默认 zh-CN：中文或中英混排统一使用 IBM Plex Sans SC。
       纯英文 deck 将 <html lang="en">，下方规则会统一切换到 XREAL Diatype。 */
    --font-xreal:"XREAL Diatype","Arial","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-ibm-plex:"IBM Plex Sans SC","Microsoft YaHei UI","Microsoft YaHei","微软雅黑",sans-serif;
    --deck-font:var(--font-ibm-plex);
    /* 固定角色字重：标题 600，正文 400，辅助文字 450，标签 500，关键数据 600 */
    --weight-display:600;
    --weight-title:600;
    --weight-body:400;
    --weight-support:450;
    --weight-label:500;
    --weight-emphasis:600;
    --chrome-body-logo-width:max(60px,5.2vw);
    --chrome-brand-gap:1.6vw;
    --chrome-label-optical-ratio:.26;
    --chrome-body-label-size:calc(var(--chrome-body-logo-width) * var(--chrome-label-optical-ratio));
    --chrome-feature-logo-width:max(72px,6.8vw);
    --chrome-feature-label-size:calc(var(--chrome-feature-logo-width) * var(--chrome-label-optical-ratio));
    --chrome-content-gap:24px;       /* 页眉到首个正文块：避免 48px 叠加后整体下坠 */
    --chrome-content-gap-tight:16px;
    --cover-title-size:min(7.2vw,12.6vh);
    --section-hero-title-size:min(5.6vw,9.8vh);
    --page-title-size:min(4.5vw,7.8vh);
    --body-copy-leading:1.48;
    /* 兼容既有组件接口：全部指向同一 deck 主字体，禁止据此拆分中英文 */
    --sans:var(--deck-font);
    --sans-zh:var(--deck-font);
    --mono:var(--deck-font);

    /* ============ Carbon 2x Grid 间距模数 (基础 8px) ============
       参考: https://carbondesignsystem.com/elements/2x-grid/overview/
       任何 padding/gap/margin 优先用这套 token,确保 8px 基线对齐 */
    --sp-3:8px;     /* 02 token */
    --sp-4:12px;    /* 03 */
    --sp-5:16px;    /* 04 */
    --sp-6:24px;    /* 05 */
    --sp-7:32px;    /* 06 */
    --sp-8:40px;    /* 07 */
    --sp-9:48px;    /* 08 */
    --sp-10:64px;   /* 09 */
    --sp-11:80px;   /* 10 */
    --sp-12:96px;   /* 11 */
    --sp-13:160px;  /* 12 */

    /* ============ Carbon Motion tokens ============
       https://carbondesignsystem.com/guidelines/motion/overview/
       两套体系:productive (功能) 短 + 锐 / expressive (叙事) 长 + 软 */
    --ease-prod:cubic-bezier(.2,0,.38,.9);          /* productive standard */
    --ease-exp:cubic-bezier(.4,.14,.3,1);            /* expressive standard */
    --ease-entry-prod:cubic-bezier(0,0,.38,.9);     /* productive entrance */
    --ease-entry-exp:cubic-bezier(0,0,.3,1);         /* expressive entrance */
    --dur-fast-1:.07s;   /* 70ms */
    --dur-fast-2:.11s;   /* 110ms */
    --dur-mod-1:.15s;    /* 150ms */
    --dur-mod-2:.24s;    /* 240ms */
    --dur-slow-1:.4s;    /* 400ms */
    --dur-slow-2:.7s;    /* 700ms */

    /* 底部分页组件安全区: 主内容最低处不要进入这条区域 */
    --nav-safe-bottom:8vh;
    --nav-dot-alpha:.08;
    --nav-dot-hover-alpha:.14;
    --nav-dot-active-alpha:.18;
    --nav-dot-dark-alpha:.10;
    --nav-dot-dark-active-alpha:.22;
  }
  html[lang^="en"]{
    --deck-font:var(--font-xreal);
    /* XREAL Diatype cap-height 约 0.70em，需比 IBM Plex Sans SC 放大以匹配 Logo 视觉字高 */
    --chrome-label-optical-ratio:.313;
    --weight-display:500;
    --weight-title:500;
    --weight-support:400;
    --weight-emphasis:500;
    --cover-title-size:min(5.6vw,9.8vh);
    --section-hero-title-size:min(4.6vw,8vh);
    --page-title-size:min(3.8vw,6.6vh);
    --body-copy-leading:1.4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--paper);color:var(--ink);
    font-family:var(--deck-font);
    font-feature-settings:"ss01","cv11";
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility
  }

  /* ============ 遗留背景 canvas（XREAL canvas-mode 永久禁用） ============ */
  canvas.bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;opacity:.55;mix-blend-mode:multiply;pointer-events:none}
  body.dark-bg canvas.bg{mix-blend-mode:screen;opacity:.42}
  body.low-power canvas.bg{display:none!important}

  /* ============ Deck 容器 + 翻页 ============ */
  #deck{position:fixed;inset:0;width:10000vw;height:100vh;display:flex;flex-wrap:nowrap;transition:transform .9s cubic-bezier(.77,0,.175,1);z-index:10;will-change:transform}
  .slide{
    width:100vw;height:100vh;flex:0 0 100vw;
    position:relative;
    padding:5.5vh 5vw 7vh 5vw;
    display:flex;flex-direction:column;
    overflow:hidden;
    background:var(--paper);color:var(--ink);
  }
  .slide.grey{background:var(--grey-1)}
  .slide.dark{background:var(--ink);color:var(--paper)}
  .slide.dark .grey-only{display:none}
  .slide.accent{background:var(--accent);color:var(--accent-on)}
  .slide[data-layout="XREAL-COVER-BLACK"],
  .slide[data-layout="XREAL-CLOSING-BLACK"],
  .slide[data-layout="XREAL-COVER-BLACK"] .canvas-card,
  .slide[data-layout="XREAL-CLOSING-BLACK"] .canvas-card{background:var(--pure-black)}
  .slide[data-media-match="matched"][data-layout="XREAL-COVER-BLACK"],
  .slide[data-media-match="matched"][data-layout="XREAL-CLOSING-BLACK"]{isolation:isolate}
  .slide[data-media-match="matched"][data-layout="XREAL-COVER-BLACK"] .canvas-card,
  .slide[data-media-match="matched"][data-layout="XREAL-CLOSING-BLACK"] .canvas-card{
    position:relative;z-index:1;background:transparent
  }
  .xreal-cover-media,.xreal-closing-media{
    position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;pointer-events:none
  }
  .xreal-cover-media{object-fit:cover;object-position:center center;filter:brightness(.44) saturate(.86)}
  .xreal-closing-media{object-fit:cover;object-position:center center;opacity:.82;filter:brightness(.24) saturate(.58)}
  .slide.accent .accent-block{background:var(--accent-on);color:var(--accent)}

  /* Hero 页透出网格背景多一点 */
  .slide.hero{background:transparent}
  .slide.hero.grey{background:rgba(var(--paper-rgb),.86);backdrop-filter:blur(1px)}
  .slide.hero.dark{background:rgba(var(--ink-rgb),.92);color:var(--paper)}

  /* ============ 装饰: 极细分隔线 ============ */
  .rule{width:100%;height:1px;background:currentColor;opacity:.18;margin:0}
  .rule.thick{height:2px;opacity:.85}
  .rule.accent{background:var(--accent);opacity:1;height:2px}
  .rule.v{width:1px;height:100%;margin:0}

  /* ============ Chrome (顶部 meta) + Foot (底部) ============ */
  .chrome{
    display:flex;justify-content:space-between;align-items:flex-start;
    font-family:var(--mono);
    font-size:14px;letter-spacing:normal;text-transform:none;
    opacity:.7;margin-bottom:auto
  }
  .chrome .l,.chrome .r{display:flex;gap:1.6em;align-items:center}
  .chrome .sep{width:24px;height:1px;background:currentColor;opacity:.5}

  .foot{
    margin-top:auto;
    display:flex;justify-content:space-between;align-items:flex-end;
    font-family:var(--mono);
    font-size:14px;letter-spacing:normal;text-transform:none;
    opacity:.55;
    padding-top:2vh;
    border-top:1px solid currentColor;
    border-color:rgba(127,127,127,.25)
  }
  .foot .nb{font-family:var(--sans);font-weight:600;letter-spacing:.04em}

  /* ============ Tag / Kicker / Meta 标签 ============ */
  .kicker{
    font-family:var(--mono);
    font-size:14px;letter-spacing:normal;text-transform:none;
    opacity:.65;margin-bottom:2.4vh;
    display:inline-flex;align-items:center;gap:.8em
  }
  .kicker::before{
    content:"";width:24px;height:1px;background:currentColor;opacity:.6
  }
  .kicker.no-line::before{display:none}
  .kicker.accent{color:var(--accent);opacity:1;font-weight:600}

  .tag{
    display:inline-block;
    font-family:var(--mono);
    font-size:14px;letter-spacing:normal;text-transform:none;
    padding:5px 10px;border:1px solid currentColor;border-radius:var(--radius-sm);opacity:.85
  }
  .tag.solid{background:currentColor;color:var(--paper);border-color:transparent}
  .tag.accent{background:var(--accent);color:var(--accent-on);border-color:transparent;opacity:1}

  /* ============ 标题层级（无衬线 · 固定角色字重 · 明确层级） ============ */
  .h-hero{
    font-family:var(--sans),var(--sans-zh);
    font-weight:var(--weight-display);
    font-size:11vw;
    line-height:.92;
    letter-spacing:-.04em;
  }
  .h-hero-zh{
    font-family:var(--sans),var(--sans-zh);
    font-weight:var(--weight-display);
    font-size:8.4vw;
    line-height:.96;
    letter-spacing:-.025em;
  }
  .h-xl{
    font-family:var(--sans),var(--sans-zh);
    font-weight:var(--weight-display);
    font-size:6vw;
    line-height:1;
    letter-spacing:-.03em;
  }
  .h-xl-zh{
    font-family:var(--sans),var(--sans-zh);
    font-weight:var(--weight-display);
    font-size:5vw;
    line-height:1.05;
    letter-spacing:-.025em;
  }
  .h-md{
    font-family:var(--sans),var(--sans-zh);
    font-weight:var(--weight-title);
    font-size:2.6vw;
    line-height:1.18;
    letter-spacing:-.015em;
  }
  .h-sub{
    font-family:var(--sans),var(--sans-zh);
    font-weight:400;
    font-size:2.2vw;
    line-height:1.3;
    letter-spacing:-.01em;
    opacity:.7;
  }

  /* ============ 正文 / 引语 / 元数据 ============ */
  .lead{
    font-family:var(--sans),var(--sans-zh);
    font-weight:400;
    font-size:1.55vw;
    line-height:1.4;
    letter-spacing:-.005em;
    opacity:.86;
  }
  .body{
    font-family:var(--sans),var(--sans-zh);
    font-weight:400;
    font-size:max(18px,1.08vw);
    line-height:1.6;
    letter-spacing:0;
    opacity:.78;
  }
  .body-sm{
    font-family:var(--sans),var(--sans-zh);
    font-weight:var(--weight-support);
    font-size:max(16px,.92vw);
    line-height:1.55;
    opacity:.7;
  }
  .xreal-cover-title{
    font-family:var(--deck-font);font-weight:var(--weight-display);
    font-size:var(--cover-title-size);line-height:.98;letter-spacing:-.03em
  }
  .xreal-section-title{
    font-family:var(--deck-font);font-weight:var(--weight-title);
    font-size:var(--section-hero-title-size);line-height:1;letter-spacing:-.03em
  }
  .xreal-page-title{
    font-family:var(--deck-font);font-weight:var(--weight-title);
    font-size:var(--page-title-size);line-height:1.02;letter-spacing:-.03em
  }
  /* 中文标题保持正体；英文标题仍可在极少数场景使用克制的斜体强调。 */
  html[lang^="zh"] h1,html[lang^="zh"] h2,html[lang^="zh"] h3,
  html[lang^="zh"] h1 *,html[lang^="zh"] h2 *,html[lang^="zh"] h3 *,
  html[lang^="zh"] .xreal-cover-title,html[lang^="zh"] .xreal-section-title,
  html[lang^="zh"] .xreal-page-title,html[lang^="zh"] .h-hero-zh,
  html[lang^="zh"] .h-xl-zh{font-style:normal!important}
  .section-hero-body{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    align-items:flex-start;max-width:78vw;padding:4vh 0 7vh
  }
  .section-hero-kicker{
    display:flex;align-items:center;gap:.8vw;margin-bottom:2.4vh;
    font-family:var(--deck-font);font-size:max(14px,.9vw);
    font-weight:var(--weight-label);color:var(--text-helper)
  }
  .section-hero-kicker::before{
    content:"";width:8px;height:8px;background:currentColor;flex:0 0 auto
  }
  .section-hero-summary{
    max-width:52ch;font-family:var(--deck-font);font-size:max(18px,1.28vw);
    font-weight:var(--weight-body);line-height:1.5;color:var(--text-secondary);
    margin-top:max(32px,3.6vh)
  }
  .section-hero-foot{
    display:flex;justify-content:space-between;align-items:end;
    border-top:1px solid var(--border-subtle);padding-top:1.4vh;
    color:var(--text-helper)
  }
  .slide.dark .section-hero-kicker,.slide.dark .section-hero-summary,.slide.dark .section-hero-foot{color:rgba(255,255,255,.68)}
  .slide.dark .section-hero-foot{border-top-color:rgba(255,255,255,.18)}
  .xreal-support-copy{line-height:var(--body-copy-leading)}
  .meta{
    font-family:var(--mono);
    font-weight:var(--weight-support);
    font-size:max(14px,.82vw);
    letter-spacing:normal;text-transform:none;
    opacity:.6;
  }
  .meta-row{
    display:flex;gap:1.4em;align-items:baseline;flex-wrap:wrap;
    font-family:var(--mono);
    font-size:max(14px,.88vw);letter-spacing:normal;text-transform:none;
    opacity:.65;
  }
  .meta-row span:not(.dot){display:inline-block}
  .meta-row .dot{
    display:inline-block;width:4px;height:4px;border-radius:50%;
    background:currentColor;opacity:.5;vertical-align:middle
  }

  /* ============ KPI Hero (视觉英雄数据) ============ */
  .kpi-hero{
    font-family:var(--sans);
    font-weight:700;
    font-size:22vw;
    line-height:.82;
    letter-spacing:-.05em;
    font-feature-settings:"tnum","ss01";
    white-space:nowrap;
  }
  .kpi-hero .unit{
    font-family:var(--sans),var(--sans-zh);
    font-weight:500;
    font-size:.22em;
    letter-spacing:0;
    opacity:var(--unit-mark-opacity);
    margin-left:var(--unit-mark-gap);
    vertical-align:text-top;
  }
  .kpi-hero.accent{color:var(--accent)}
  .kpi-big{
    font-family:var(--sans);
    font-weight:700;
    font-size:11vw;
    line-height:.85;
    letter-spacing:-.04em;
    font-feature-settings:"tnum"
  }
  .kpi-mid{
    font-family:var(--sans);
    font-weight:var(--weight-emphasis);
    font-size:6vw;
    line-height:.88;
    letter-spacing:-.03em;
    font-feature-settings:"tnum"
  }

  /* ============ Stat Card (数据卡片 · 极简) ============ */
  .stat-card{
    display:flex;flex-direction:column;
    gap:.6vh;align-items:flex-start;
    padding-top:1.6vh;
    border-top:2px solid currentColor;
  }
  .stat-card.thin{border-top-width:1px;border-color:rgba(127,127,127,.4)}
  .stat-card.accent-top{border-top-color:var(--accent);border-top-width:3px}
  .stat-card .stat-label{
    font-family:var(--mono);
    font-size:max(14px,.82vw);
    letter-spacing:normal;text-transform:none;
    opacity:.6;
  }
  .stat-card .stat-nb{
    font-family:var(--sans);
    font-weight:var(--weight-emphasis);
    font-size:5.6vw;
    line-height:.88;
    letter-spacing:-.035em;
    font-feature-settings:"tnum";
    margin-top:.4vh;
  }
  .stat-card .stat-nb .stat-unit{
    font-family:var(--sans),var(--sans-zh);
    font-weight:500;
    font-size:.32em;
    letter-spacing:0;
    opacity:var(--unit-mark-opacity);
    margin-left:var(--unit-mark-gap);
    vertical-align:text-top;
  }
  /* 展示级数字的单位统一挂在右上肩位；正文中的单位才随文字基线。 */
  .unit-degree{
    display:inline-block;font-size:.34em;line-height:1;
    vertical-align:text-top;margin-left:var(--unit-degree-gap);letter-spacing:0;
    opacity:var(--unit-mark-opacity);white-space:nowrap
  }
  .ledger-num .unit{
    display:inline-block;font-size:.32em;font-weight:var(--weight-label);line-height:1;
    vertical-align:text-top;margin-left:var(--unit-mark-gap);letter-spacing:0;
    opacity:var(--unit-mark-opacity);white-space:nowrap
  }
  .ledger-num .unit-degree{margin-left:var(--unit-degree-gap)}
  .kpi-hero,.kpi-big,.kpi-mid,.kpi-thin,.kpi-thin-sm,
  .kpi-cell .nb,.stat-card .stat-nb,.tl-node .multi,
  .bar-tower .nb,.h-bar-chart .row-val{white-space:nowrap}
  .stat-card .stat-note{
    font-family:var(--sans),var(--sans-zh);
    font-weight:400;
    font-size:max(16px,.98vw);
    line-height:1.5;
    opacity:.7;
    margin-top:.6vh;
  }
  .grid-4 .stat-card .stat-nb{font-size:4.6vw}
  .grid-3 .stat-card .stat-nb{font-size:6.4vw}
  .grid-6 .stat-card .stat-nb{font-size:4vw}

  /* ============ Accent Block (高亮色块包裹内容) ============ */
  .accent-block{
    background:var(--accent);color:var(--accent-on);
    padding:2.4vh 2vw;
  }
  .accent-block.tight{padding:1.4vh 1.4vw}
  .accent-block .h-md,.accent-block .h-xl,.accent-block .kpi-mid{color:var(--accent-on)}

  .ink-block{
    background:var(--ink);color:var(--paper);
    padding:2.4vh 2vw
  }
  .grey-block{
    background:var(--grey-1);
    padding:2.4vh 2vw
  }

  /* 高亮文字 (mark 风格) */
  .mark{
    background:var(--accent);color:var(--accent-on);
    padding:0 .2em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  .mark.ink{background:var(--ink);color:var(--paper)}
  .underline-accent{
    background-image:linear-gradient(to bottom, transparent 70%, var(--accent) 70%, var(--accent) 96%, transparent 96%);
    padding:0 .05em
  }

  /* ============ 网格系统 (模块化网格) ============ */
  .frame{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .frame.grid-2-7-5,
  .frame.grid-2-6-6,
  .frame.grid-2-8-4,
  .frame.grid-2-4-8,
  .frame.grid-3-3,
  .frame.grid-12,
  .frame.grid-6,
  .frame.grid-4,
  .frame.grid-3{display:grid}

  /* 12 列模块化网格 (XREAL Style 核心) */
  .grid-12{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:2vh 1.2vw;
    align-items:start;
  }
  .span-2{grid-column:span 2}
  .span-3{grid-column:span 3}
  .span-4{grid-column:span 4}
  .span-5{grid-column:span 5}
  .span-6{grid-column:span 6}
  .span-7{grid-column:span 7}
  .span-8{grid-column:span 8}
  .span-9{grid-column:span 9}
  .span-12{grid-column:span 12}

  /* 经典分栏 */
  .grid-2-7-5{display:grid;grid-template-columns:7fr 5fr;gap:3vw 4vh;align-items:start}
  .grid-2-6-6{display:grid;grid-template-columns:1fr 1fr;gap:3vw 4vh;align-items:start}
  .grid-2-8-4{display:grid;grid-template-columns:8fr 4fr;gap:3vw 4vh;align-items:start}
  .grid-2-4-8{display:grid;grid-template-columns:4fr 8fr;gap:3vw 4vh;align-items:start}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw 4vh;align-items:start}
  .grid-3-3{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:2.4vh 2vw}
  .grid-4{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:3vh 3vw;flex:1;align-content:center}
  .grid-6{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3vh 2.4vw;flex:1;align-content:center}

  /* 工具类 */
  .col{display:flex;flex-direction:column;gap:2vh}
  .row{display:flex;align-items:center;gap:2vw}
  .fill{flex:1}
  .center{align-items:center;justify-content:center;text-align:center}
  .right{text-align:right;justify-self:end}
  .top{align-self:start}
  .bottom{align-self:end}
  .va-center{align-self:center}
  .nowrap{white-space:nowrap}
  /* XREAL 语义色：默认不参与基础配色，只用于明确的品牌语义 */
  .xreal-critical{color:var(--brand-red)!important}
  .xreal-critical-fill{background:var(--brand-red)!important;color:#fff!important}
  .xreal-silver{color:var(--brand-silver)!important}
  .xreal-gold{color:var(--brand-gold)!important}

  /* 非对称定位 */
  .pos-absolute{position:absolute}
  .bottom-left{position:absolute;left:5vw;bottom:8vh;max-width:50vw}
  .bottom-right{position:absolute;right:5vw;bottom:8vh;max-width:50vw;text-align:right}
  .top-right{position:absolute;right:5vw;top:5.5vh;text-align:right}
  .top-left{position:absolute;left:5vw;top:5.5vh}

  /* ============ Callout (引用框 · 极简) ============ */
  .callout{
    padding:2vh 2vw;
    border-left:3px solid var(--accent);
    font-family:var(--sans),var(--sans-zh);
    font-size:max(14px,1vw);
    line-height:1.55;
    opacity:.9;
  }
  .callout.ink{border-left-color:currentColor}
  .callout .cite,.callout .callout-src{
    display:block;margin-top:1.2vh;
    font-family:var(--mono);
    font-size:14px;letter-spacing:normal;text-transform:none;
    opacity:.6;
  }

  /* ============ Icons (Google Material Symbols Outlined) ============ */
  .material-symbols-outlined{
    font-family:'Material Symbols Outlined';
    font-weight:400;font-style:normal;font-size:1em;line-height:1;
    letter-spacing:normal;text-transform:none;display:inline-block;
    white-space:nowrap;word-wrap:normal;direction:ltr;
    -webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
    vertical-align:-.14em;flex-shrink:0
  }
  .material-symbols-outlined.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
  .ico{width:1em;height:1em;display:inline-block;vertical-align:-.12em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .ico-lg,.ico-md,.ico-sm{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
  .ico-lg{width:2.4vw;height:2.4vw;stroke-width:1.4;display:inline-block}
  .ico-md{width:1.6vw;height:1.6vw;stroke-width:1.6;display:inline-block;vertical-align:-.4em}
  .ico-sm{width:1vw;height:1vw;stroke-width:1.8;display:inline-block;vertical-align:-.15em;opacity:.7}

  /* ============ 几何小图标 (装饰) ============ */
  .geo-dot{width:.7vw;height:.7vw;border-radius:50%;background:var(--accent);display:inline-block;vertical-align:middle}
  .geo-square{width:.7vw;height:.7vw;background:var(--accent);display:inline-block;vertical-align:middle}
  .geo-line{width:2vw;height:2px;background:var(--accent);display:inline-block;vertical-align:middle}
  .geo-circle-o{width:.9vw;height:.9vw;border:2px solid currentColor;border-radius:50%;display:inline-block;vertical-align:middle}

  /* ============ 图片 frame-img ============ */
  .frame-img{overflow:hidden;position:relative;background:var(--paper);box-sizing:border-box;width:100%;border-radius:var(--radius-sm)}
  .slide.dark .frame-img{background:rgba(255,255,255,.06)}
  .frame-img > img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
  .frame-img.fit-contain > img{object-fit:contain;object-position:center center}
  .frame-img.pos-top > img{object-position:top center}
  .frame-img.pos-face > img{object-position:center 35%}
  .frame-img.r-16x9{aspect-ratio:16/9;max-height:64vh}
  .frame-img.r-21x9{aspect-ratio:21/9;max-height:54vh}
  .frame-img.r-16x10{aspect-ratio:16/10;max-height:56vh}
  .frame-img.r-4x3{aspect-ratio:4/3;max-height:56vh}
  .frame-img.r-3x2{aspect-ratio:3/2;max-height:46vh}
  .frame-img.r-3x4{aspect-ratio:3/4;max-height:60vh}
  .frame-img.r-1x1{aspect-ratio:1/1;max-height:50vh}
  .frame-img.h-16{height:16vh}
  .frame-img.h-18{height:18vh}
  .frame-img.h-22{height:22vh}
  .frame-img.h-26{height:26vh}
  .frame-img.h-28{height:28vh}
  .frame-img.h-32{height:32vh}
  .frame-img.swiss-lined{border-top:2px solid var(--accent)}
  .frame-img.swiss-keyline{border:0}

  /* P22 Image Hero: 下半屏内容区必须和图片拉开距离,不要贴在图下沿 */
  .image-hero-body{
    display:grid;grid-template-columns:6fr 6fr;gap:3vw;
    padding:6.6vh 5vw 4.4vh;flex:1;align-content:start
  }
  .image-hero-stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;align-items:start
  }
  .img-cap{
    display:block;margin-top:.8vh;
    font-family:var(--mono);
    font-weight:var(--weight-support);
    font-size:max(14px,.82vw);
    letter-spacing:normal;text-transform:none;
    opacity:.6;
  }
  figure.frame-img,figure.tile{margin:0;display:flex;flex-direction:column;min-width:0}
  figure.tile > .frame-img{flex:0 0 auto}

  /* XREAL Style 图文混排：统一 8px 小圆角、发丝线、黑白灰结构和克制语义色；图像容器不加阴影 */
  .swiss-img-split{display:grid;grid-template-columns:5fr 7fr;gap:3vw;align-items:start;flex:1;min-height:0}
  .swiss-img-split.reverse{grid-template-columns:7fr 5fr}
  .swiss-img-split.align-bottom{align-items:end}
  .swiss-img-split.align-bottom .swiss-img-copy{align-self:end}
  .swiss-img-split.align-image-bottom{align-items:end;padding-bottom:var(--nav-safe-bottom)}
  .swiss-img-split.align-image-bottom .swiss-img-copy{align-self:end}
  .swiss-img-split.align-image-bottom figure.tile{align-self:end;position:relative}
  .swiss-img-split.align-image-bottom figure.tile > .swiss-img-caption{
    position:absolute;left:0;right:0;top:calc(100% + var(--sp-4));margin-top:0
  }
  .nav-safe-bottom{padding-bottom:var(--nav-safe-bottom)}
  .nav-safe-bottom-tight{padding-bottom:calc(var(--nav-safe-bottom) * .65)}
  .swiss-img-copy{display:flex;flex-direction:column;gap:var(--sp-6);min-width:0}
  .swiss-img-copy .rule{margin:0}
  .swiss-img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-5);align-items:start;margin-top:var(--sp-7)}
  .swiss-img-grid.two{grid-template-columns:repeat(2,1fr)}
  .swiss-img-grid.tight{margin-top:0}
  .swiss-img-caption{
    display:flex;justify-content:space-between;gap:var(--sp-5);
    margin-top:var(--sp-4);
    font-family:var(--mono);font-size:max(14px,.74vw);
    letter-spacing:normal;text-transform:none;color:var(--text-helper);
    border-top:1px solid var(--border-subtle);padding-top:var(--sp-4)
  }
  .swiss-img-caption strong{
    font-family:var(--sans),var(--sans-zh);font-size:max(16px,.9vw);
    font-weight:600;letter-spacing:0;text-transform:none;color:var(--text-primary)
  }

  /* ============ Bar Chart (扁平几何图表) ============ */
  .bar-chart{display:flex;flex-direction:column;gap:1.4vh}
  .bar-row{display:grid;grid-template-columns:8em 1fr 4em;gap:1.4vw;align-items:center}
  .bar-row .bar-label{font-family:var(--mono);font-size:max(14px,.84vw);letter-spacing:normal;text-transform:none;opacity:.7}
  .bar-row .bar-track{height:18px;background:rgba(127,127,127,.18);position:relative;overflow:hidden;border-radius:var(--radius-sm)}
  .bar-row .bar-fill{height:100%;background:var(--accent);position:absolute;left:0;top:0;border-radius:var(--radius-sm)}
  .bar-row .bar-fill.ink{background:currentColor}
  .bar-row .bar-value{font-family:var(--sans);font-weight:700;font-size:max(16px,1.05vw);text-align:right;font-feature-settings:"tnum"}

  /* ============ 导航 ============ */
  /* 底部分页导航: 仅保留方块本身,无背景无描边 */
  #nav{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);z-index:30;display:flex;gap:10px;padding:0;background:transparent;border:0;transition:opacity .2s ease}
  #nav.is-hidden{opacity:0;pointer-events:none}
  #nav .dot{width:6px;height:6px;background:rgba(0,0,0,var(--nav-dot-alpha));cursor:pointer;transition:all .25s ease;border:0;padding:0;border-radius:0}
  #nav .dot:hover{background:rgba(0,0,0,var(--nav-dot-hover-alpha))}
  #nav .dot.active{background:rgba(0,0,0,var(--nav-dot-active-alpha));width:18px}
  body.dark-bg #nav .dot{background:rgba(255,255,255,var(--nav-dot-dark-alpha))}
  body.dark-bg #nav .dot.active{background:rgba(255,255,255,var(--nav-dot-dark-active-alpha))}


  /* ESC 索引页: 动画元素强制可见 (覆盖 motion-ready 的 opacity:0) */
  #overview [data-anim]{opacity:1!important;transform:none!important}
  #overview .slide *{animation:none!important;transition:none!important}

  /* 统一卡片样式 token: card-fill (默认灰底 · 中性) + card-ink (反转高对比) + card-accent (单一焦点) */
  .card-fill{background:#f5f5f4;border:0;border-radius:var(--radius-sm);color:var(--text-primary)}
  .card-ink{background:var(--ink);border:0;border-radius:var(--radius-sm);color:var(--paper)}
  .card-ink .t-meta,.card-ink .t-cat{color:rgba(255,255,255,.6)}
  .card-accent{background:var(--accent);border:0;border-radius:var(--radius-sm);color:var(--accent-on)}
  .card-accent .t-meta,.card-accent .t-cat{color:var(--accent-on)}
  .hero-ink-col,.force-card{border-radius:var(--radius-sm);overflow:hidden}

  /* S16 Multi-card Brief: 默认六卡等权；仅在存在明确优先级语义时，才允许一张高对比焦点卡。 */
  .brief-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.4vh 1.4vw;flex:1;align-content:stretch;margin-top:3vh}
  .brief-card{background:var(--paper);border:1px solid var(--grey-2);color:var(--ink);padding:var(--brief-card-pad);display:flex;flex-direction:column;justify-content:space-between;min-height:0;border-radius:var(--radius-sm);overflow:hidden}
  .brief-card.is-accent{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .brief-card.is-accent .t-h-prod{color:var(--paper)}
  .brief-card.is-accent .t-meta,.brief-card.is-accent .t-cat,.brief-card.is-accent .t-helper,
  .brief-card.is-accent p,.brief-card.is-accent small{color:rgba(255,255,255,.74)}

  /* ============ 动效 (与原模板一致) ============ */
  [data-anim]{opacity:1}
  body.motion-ready [data-anim]{opacity:0}
  body.motion-ready [data-anim="left"]{transform:translateX(-24px)}
  body.motion-ready [data-anim="right"]{transform:translateX(24px)}
  body.motion-ready [data-anim="line"]{opacity:0;transform:translateY(10px)}
  body.low-power #deck{transition:none!important}
  body.low-power *,
  body.low-power *::before,
  body.low-power *::after{animation:none!important;transition:none!important}
  body.low-power.motion-ready [data-anim],
  body.low-power [data-anim]{opacity:1!important;transform:none!important}

  /* ============================================================
     ↓↓↓ V2 EXTENSIONS · Canvas Mode + 参考图新类
     验证效果后沉淀回 template-xreal.html
     ============================================================ */

  /* 全屏铺满模式 · 关闭 WebGL · 卡片即页面 */
  body.canvas-mode{background:var(--paper)}
  body.canvas-mode canvas.bg{display:none !important}
  body.canvas-mode .slide{background:var(--paper);padding:0;align-items:stretch;justify-content:stretch}
  body.canvas-mode .slide.hero{background:var(--paper)}

  .canvas-card{
    width:100vw;
    height:100vh;
    background:var(--paper);color:var(--ink);
    padding:5.6vh 5vw 4.4vh;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    box-shadow:none;
    border-radius:0;
  }
  .slide.dark .canvas-card{background:var(--ink);color:var(--paper)}
  .slide.accent .canvas-card{background:var(--accent);color:var(--accent-on)}
  .slide.grey .canvas-card{background:var(--grey-1);color:var(--ink)}
  .slide.split .canvas-card{padding:0;flex-direction:row}

  .slide.accent .canvas-card .chrome-min{color:rgba(255,255,255,.62)}
  .slide.accent .canvas-card .t-meta{color:rgba(255,255,255,.7)}

  /* 编号目录页 · 超大数字 + 国家名风格 — 使用稳定 display 字重 */
  .num-mega{
    font-family:var(--sans);font-weight:var(--weight-display);
    font-size:9vw;line-height:1;letter-spacing:-.04em;
    font-feature-settings:"tnum"
  }
  .num-mega.thin{font-weight:var(--weight-title)}
  .name-mega{
    font-family:var(--sans);font-weight:var(--weight-display);
    font-size:9vw;line-height:1;letter-spacing:-.035em;
  }
  .name-mega.muted{color:var(--grey-3)}

  /* 超大 KPI — 数据使用明确字重,不因字号变大而变细 */
  .kpi-thin{
    font-family:var(--sans);font-weight:var(--weight-emphasis);
    font-size:14vw;line-height:.92;letter-spacing:-.045em;
    font-feature-settings:"tnum"
  }
  .kpi-thin .unit{display:inline-block;font-size:.3em;font-weight:var(--weight-label);line-height:1;opacity:var(--unit-mark-opacity);margin-left:var(--unit-mark-gap);vertical-align:text-top}
  .kpi-thin .unit.unit-word,.kpi-thin-sm .unit.unit-word{
    font-size:.24em;letter-spacing:normal;word-spacing:normal;margin-left:.24em;white-space:nowrap
  }
  .kpi-thin.accent{color:var(--accent)}
  .kpi-thin-sm{
    font-family:var(--sans);font-weight:var(--weight-title);
    font-size:5.6vw;line-height:1.04;letter-spacing:-.03em;
    font-feature-settings:"tnum"
  }
  .kpi-thin-sm .unit{display:inline-block;font-size:.3em;font-weight:var(--weight-label);line-height:1;opacity:var(--unit-mark-opacity);margin-left:var(--unit-mark-gap);vertical-align:text-top}

  /* 4 列细线 KPI 行 — 顶部一根 hairline,内部不再加竖线 */
  /* 4 列 KPI: 用纵向分割线建立网格感 (Carbon 2x grid 模数) */
  .kpi-row-4{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:0;padding-top:2.4vh;
    border-top:1px solid var(--grey-2)
  }
  .kpi-row-4 > .kpi-cell{
    padding:1.6vh 1.6vw 0;
    border-left:1px solid var(--grey-2)
  }
  .kpi-row-4 > .kpi-cell:first-child{padding-left:0;border-left:none}
  .kpi-cell .lbl{font-family:var(--mono);font-size:max(14px,.78vw);letter-spacing:normal;text-transform:none;opacity:.55;margin-bottom:1.2vh}
  .kpi-cell .nb{font-family:var(--sans);font-weight:var(--weight-emphasis);font-size:3.2vw;line-height:1;letter-spacing:-.025em;font-feature-settings:"tnum"}
  .kpi-cell .nb .unit{display:inline-block;font-size:.32em;font-weight:var(--weight-label);line-height:1;opacity:var(--unit-mark-opacity);margin-left:var(--unit-mark-gap);vertical-align:text-top}
  .kpi-cell .note{font-family:var(--sans),var(--sans-zh);font-size:max(16px,.92vw);line-height:1.5;opacity:.7;margin-top:1.2vh}

  /* 时间线轴 — 通用 axis token, 横纵共享。
     S02 只占正文宽度的 72%-82%，轴线由每行自身连续绘制，避免横线无限延伸。 */
  .timeline-v{
    --tl-axis-w:24px;        /* axis 列固定宽度 */
    --tl-dot:10px;           /* 圆点直径 */
    --tl-time-w:6rem;        /* 使用 rem 锁定列宽，避免表头/正文字号改变 em */
    --tl-metric-w:7.4rem;
    position:relative;width:81%;min-width:0;margin-top:var(--sp-7)
  }
  .tl-head,.tl-node{
    display:grid;
    grid-template-columns:var(--tl-axis-w) minmax(0,var(--tl-time-w)) minmax(0,var(--tl-metric-w)) minmax(0,1fr);
    gap:0 var(--sp-4)
  }
  .tl-head{
    position:relative;align-items:end;padding:0 0 1.4vh;
    font-family:var(--mono);font-size:max(14px,.72vw);line-height:1.2;
    color:var(--text-helper)
  }
  .tl-head::after,.tl-node::after{
    content:"";position:absolute;
    left:calc(var(--tl-axis-w) + var(--sp-4));right:0;bottom:0;
    height:1px;background:var(--border-subtle);pointer-events:none
  }
  .tl-head::after{background:var(--border-strong)}
  .tl-head > span,.tl-node .yr,.tl-node .multi,.tl-node .tl-copy{justify-self:start;text-align:left}
  .tl-node{
    position:relative;
    align-items:center;padding:1.8vh 0
  }
  .tl-node::before{
    content:"";position:absolute;left:calc(var(--tl-axis-w) / 2);top:0;bottom:0;
    width:1px;transform:translateX(-50%);background:var(--border-strong);
    opacity:.62;pointer-events:none;z-index:0
  }
  .tl-node:last-child::after{display:none}
  .tl-axis{height:100%;display:grid;place-items:center;position:relative}
  /* 进度点: 纯色实心圆,无背景无描边,精确居中在 axis 列中线 */
  .tl-node .dot{
    display:block;
    width:var(--tl-dot);height:var(--tl-dot);
    border-radius:50%;
    background:currentColor;
    justify-self:center;
    z-index:1
  }
  .tl-node.accent .dot{background:var(--accent)}
  .tl-node .yr{
    font-family:var(--mono);font-weight:500;
    font-size:max(14px,1vw);letter-spacing:.04em
  }
  .tl-node .multi{
    font-family:var(--sans);font-weight:var(--weight-emphasis);
    font-size:clamp(28px,2.8vw,56px);
    line-height:.95;letter-spacing:-.025em;
    white-space:nowrap;
    overflow:hidden;
    min-width:0
  }
  .tl-node .multi .unit{
    font-size:.36em;font-weight:var(--weight-label);opacity:var(--unit-mark-opacity);
    margin-left:var(--unit-mark-gap);
    vertical-align:text-top;
    letter-spacing:0
  }
  .tl-node.accent .multi{color:var(--accent)}
  .tl-node .desc,.tl-node .tl-copy{
    font-family:var(--sans),var(--sans-zh);
    min-width:0;
    color:var(--text-primary)
  }
  .tl-node .tl-copy{display:grid;gap:.5vh}
  .tl-node .tl-stage{font-size:max(17px,1.08vw);line-height:1.25;font-weight:600;color:var(--ink)}
  .tl-node .tl-impact{font-size:max(16px,.9vw);line-height:1.45;color:var(--text-secondary)}
  .tl-node.accent .tl-stage{color:var(--accent)}

  /* 横向时间线 (.timeline-h) — 与 .timeline-v 共享 axis token, 视觉语言一致 */
  .timeline-h{
    --tl-axis-w:8px;
    --tl-dot:8px;
    position:relative;
    flex:1;
    display:flex;align-items:center
  }
  .timeline-h::before{
    content:"";position:absolute;
    top:50%;left:5%;right:5%;height:1px;
    transform:translateY(-50%);
    background:repeating-linear-gradient(to right,currentColor 0 4px,transparent 4px 8px);
    opacity:.35;pointer-events:none;z-index:0
  }
  .timeline-h .tl-row{
    position:relative;width:100%;
    display:grid;grid-template-columns:repeat(5,1fr);
    align-items:center
  }
  .timeline-h .th-node{
    position:relative;display:flex;justify-content:center
  }
  /* 横向 dot: 8px 纯色实心,无描边无阴影 (与 P2 保持一致) */
  .timeline-h .th-node .dot{
    width:var(--tl-dot);height:var(--tl-dot);
    border-radius:50%;
    background:var(--ink);
    z-index:1;position:relative
  }
  .timeline-h .th-node.accent .dot{background:var(--accent)}
  .timeline-h .th-node .label{
    position:absolute;left:50%;transform:translateX(-50%);
    width:13vw;text-align:center;
    display:flex;flex-direction:column;gap:.4vh
  }
  .timeline-h .th-node.up .label{bottom:calc(50% + 22px)}
  .timeline-h .th-node.down .label{top:calc(50% + 22px)}
  .timeline-h .th-node .yr{
    font-family:var(--mono);font-size:max(14px,.78vw);letter-spacing:.05em;
    color:var(--text-helper);font-weight:500
  }
  .timeline-h .th-node.accent .yr{color:var(--accent)}
  .timeline-h .th-node .name{
    font-family:var(--deck-font);font-size:max(16px,1.05vw);font-weight:600;
    color:var(--text-primary);line-height:1.2;letter-spacing:-.005em
  }
  .timeline-h .th-node.accent .name{color:var(--accent)}
  .timeline-h .th-node .desc{
    font-family:var(--sans),var(--sans-zh);font-size:max(14px,.84vw);
    color:var(--text-secondary);font-weight:400;line-height:1.4
  }

  /* 几何图示 (参考图 5) — SVG-friendly 容器 */
  .geo-icon{width:5vw;height:5vw;display:block;margin-bottom:2.2vh;color:var(--ink);flex-shrink:0}
  .slide.dark .geo-icon{color:var(--paper)}
  .geo-icon svg{width:100%;height:100%;overflow:visible}
  .geo-icon .stroke{fill:none;stroke:currentColor;stroke-width:1.4}
  .geo-icon .stroke-accent{fill:none;stroke:var(--accent);stroke-width:1.4}
  .geo-icon .fill-accent{fill:var(--accent)}

  /* 卡片网格 (参考图 1 卡片漂浮) — 在 canvas-card 内部再分卡 */
  .sub-grid-3-2{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.4vh 1.4vw;flex:1;align-content:stretch;margin-top:3vh}
  .sub-card{
    background:var(--grey-1);
    padding:var(--sub-card-pad);
    display:flex;flex-direction:column;
    position:relative;border-radius:var(--radius-sm);
    min-height:0
  }
  .slide.dark .sub-card{background:rgba(255,255,255,.06)}
  .sub-card.accent{background:var(--accent);color:var(--accent-on)}
  .sub-card.ink{background:var(--ink);color:var(--paper)}
  .sub-card .nb-corner{
    position:absolute;top:var(--sub-card-pad);right:var(--sub-card-pad);
    font-family:var(--mono);font-size:max(14px,.8vw);
    letter-spacing:.04em;opacity:.55
  }
  .sub-card .ttl{font-family:var(--sans),var(--sans-zh);font-weight:500;font-size:max(17px,1.5vw);line-height:1.2;letter-spacing:-.015em;margin-bottom:1vh}
  .sub-card .desc{font-family:var(--sans),var(--sans-zh);font-size:max(16px,.94vw);line-height:1.55;opacity:.78;margin-top:auto}
  .sub-card .material-symbols-outlined{font-size:2.4vw;color:currentColor;margin-bottom:1.6vh}
  .sub-card.accent .material-symbols-outlined{color:var(--accent-on)}
  .sub-card.has-media .card-media-slot{
    display:block;width:100%;height:9vh;min-height:58px;object-fit:contain;object-position:center center;
    margin:auto 0 1vh
  }
  .sub-card.has-media .card-media-slot[data-media-fit="inset-prominent"]{
    height:12vh;min-height:88px;object-fit:cover;object-position:center 50%;
    margin:auto 0 .8vh
  }
  .sub-card.has-media .desc{margin-top:0}

  /* 三层架构纯色块拼图 (参考图 4 + 6) — 横排等高色块 */
  .stack-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;flex:1;margin-top:6vh;align-items:stretch}
  .stack-block{
    display:flex;flex-direction:column;
    padding:3.2vh 1.8vw 2.4vh;
    position:relative;border-radius:var(--radius-sm);
    min-height:0
  }
  .stack-block.b-accent{background:var(--accent);color:var(--accent-on)}
  .stack-block.b-grey{background:var(--grey-1);color:var(--ink)}
  .stack-block.b-ink{background:var(--ink);color:var(--paper)}
  .stack-block .layer-nb{font-family:var(--mono);font-size:max(14px,.84vw);letter-spacing:.04em;opacity:.65;margin-bottom:auto}
  .stack-block .layer-icon{margin-bottom:1.6vh}
  .stack-block .layer-icon svg{width:3vw;height:3vw}
  .stack-block .layer-icon .stroke{fill:none;stroke:currentColor;stroke-width:1.6}
  .stack-block .layer-ttl{font-family:var(--sans),var(--sans-zh);font-weight:400;font-size:max(17px,2vw);line-height:1.1;margin-top:1vh;letter-spacing:-.02em}
  .stack-block .layer-desc{font-family:var(--sans),var(--sans-zh);font-weight:400;font-size:max(16px,.94vw);line-height:1.55;opacity:.88;margin-top:1.4vh}
  .stack-block .material-symbols-outlined{font-size:2.6vw;margin-bottom:1.6vh}
  .stack-block .layer-tag{font-family:var(--mono);font-size:max(14px,.74vw);letter-spacing:normal;text-transform:none;opacity:.7;margin-top:1.6vh;border-top:1px solid currentColor;padding-top:1vh}
  .stack-block.has-media .layer-nb{margin-bottom:1.2vh}
  .stack-block.has-media .stack-card-media{
    display:block;width:100%;height:16vh;min-height:96px;object-fit:contain;object-position:center center;
    margin:auto 0 1.2vh
  }
  .stack-block.has-media.media-full-bleed{overflow:hidden;isolation:isolate}
  .stack-block.has-media.media-full-bleed .layer-nb{margin-bottom:auto}
  .stack-block.has-media.media-full-bleed::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.12) 8%,rgba(0,0,0,.18) 44%,rgba(0,0,0,.78) 100%)
  }
  .stack-block.has-media.media-full-bleed .stack-card-media{
    position:absolute;inset:0;z-index:0;width:100%;height:100%;min-height:0;
    margin:0;object-fit:cover;object-position:center 46%;filter:brightness(.82) saturate(.86)
  }
  .stack-block.has-media.media-full-bleed > :not(.stack-card-media){position:relative;z-index:2}

  /* S12 contextual manifesto background. Keep the ink banner and product mark
     as foreground identity; use only lifestyle/conceptual/brand-KV media. */
  .slide[data-layout="S12"].manifesto-media-slide{position:relative;isolation:isolate;overflow:hidden}
  .slide[data-layout="S12"].manifesto-media-slide::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.56) 0%,rgba(0,0,0,.46) 58%,rgba(0,0,0,.54) 100%)
  }
  .slide[data-layout="S12"] .manifesto-media{
    position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;
    filter:brightness(.82) saturate(.82)
  }
  .slide[data-layout="S12"].manifesto-media-slide .canvas-card{position:relative;z-index:2;background:transparent}

  /* S14 loop grammar: one fine contained loop, HTML labels, one semantic return. */
  .loop-diagram{flex:1;min-height:0;display:grid;grid-template-columns:5fr 7fr;gap:4vw;align-items:stretch;margin-top:3vh}
  .loop-steps{display:grid;gap:0;border-top:1px solid var(--border-strong)}
  .loop-step{display:grid;grid-template-columns:3.4vw 1fr;gap:1vw;align-items:start;padding:1.7vh 0;border-bottom:1px solid var(--border-subtle)}
  .loop-step .step-num{font-family:var(--mono);font-size:max(14px,.84vw);color:var(--text-helper)}
  .loop-step h3{font-size:min(2.5vw,4.3vh);line-height:1.05;font-weight:var(--weight-title);margin-bottom:.5vh}
  .loop-step p{font-size:max(16px,.9vw);line-height:1.4;color:var(--text-secondary)}
  .loop-visual{position:relative;min-height:36vh;overflow:hidden;border:1px solid var(--border-strong);background:var(--paper)}
  .loop-graphic{position:absolute;inset:7%;width:86%;height:86%}
  .loop-track{fill:none;stroke:var(--border-subtle);stroke-width:2}
  .loop-segment{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
  .loop-segment.return{stroke:var(--chart-critical)}
  .loop-node{position:absolute;z-index:2;width:9.5em;padding:.9vh .75vw;background:var(--paper);border-top:1px solid var(--ink);display:grid;grid-template-columns:auto 1fr;gap:.5vw;align-items:baseline}
  .loop-node .node-num{font-family:var(--mono);font-size:max(14px,.7vw);color:var(--text-helper)}
  .loop-node strong{font-size:max(16px,.96vw);font-weight:600}
  .loop-visual[data-loop-count="3"] .loop-node.n1{left:8%;top:7%}.loop-visual[data-loop-count="3"] .loop-node.n2{right:8%;top:7%}.loop-visual[data-loop-count="3"] .loop-node.n3{left:50%;bottom:7%;transform:translateX(-50%)}
  .loop-visual[data-loop-count="4"] .loop-node.n1{left:8%;top:7%}.loop-visual[data-loop-count="4"] .loop-node.n2{right:8%;top:7%}.loop-visual[data-loop-count="4"] .loop-node.n3{right:8%;bottom:7%}.loop-visual[data-loop-count="4"] .loop-node.n4{left:8%;bottom:7%}
  .loop-visual[data-loop-count="5"] .loop-node.n1{left:8%;top:7%}.loop-visual[data-loop-count="5"] .loop-node.n2{left:50%;top:7%;transform:translateX(-50%)}.loop-visual[data-loop-count="5"] .loop-node.n3{right:8%;top:7%}.loop-visual[data-loop-count="5"] .loop-node.n4{right:8%;bottom:7%}.loop-visual[data-loop-count="5"] .loop-node.n5{left:8%;bottom:7%}
  .loop-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;width:13em}
  .loop-core strong{display:block;font-size:min(2.8vw,4.8vh);line-height:1.02;font-weight:var(--weight-title);letter-spacing:-.03em}
  .loop-core span{display:block;margin-top:.8vh;font-family:var(--mono);font-size:max(14px,.72vw);color:var(--text-helper)}

  /* S17 relationship grammars: use a directional flow by default.
     Reserve concentric rings for genuine containment relationships. */
  .system-diagram{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:4vw;align-items:stretch;margin-top:3vh}
  .system-copy{min-width:0;padding-top:1.2vh;max-width:30ch}
  .system-kicker{font-family:var(--deck-font);font-size:max(14px,.78vw);font-weight:var(--weight-label);color:var(--text-helper)}
  .system-thesis{font-size:min(3.2vw,5.4vh);line-height:1.05;font-weight:var(--weight-title);letter-spacing:-.025em;margin-top:1.4vh}
  .system-summary{font-size:max(16px,1vw);line-height:1.52;color:var(--text-secondary);margin-top:2vh;max-width:29ch}
  .system-flow{display:flex;flex-direction:column;align-self:stretch;min-height:0;border-top:1px solid var(--border-strong)}
  .system-node{flex:1 1 0;display:grid;grid-template-columns:minmax(0,8.8em) minmax(0,1fr);gap:1.8vw;align-items:center;padding:1.7vh 0;border-bottom:1px solid var(--border-subtle)}
  .system-level{font-family:var(--mono);font-size:max(14px,.76vw);line-height:1.3;color:var(--text-helper)}
  .system-title{display:block;font-family:var(--sans),var(--sans-zh);font-size:min(2.15vw,3.8vh);line-height:1.05;font-weight:var(--weight-title);letter-spacing:-.02em}
  .system-effect{font-size:max(16px,.9vw);line-height:1.45;color:var(--text-secondary);margin-top:.6vh}
  .system-node.is-core .system-title{color:var(--accent)}
  .system-link{flex:0 0 auto;display:grid;grid-template-columns:minmax(0,8.8em) minmax(0,1fr);gap:1.8vw;align-items:center;padding:.7vh 0;color:var(--text-helper)}
  .system-link .material-symbols-outlined{justify-self:center;font-size:1.35vw;color:var(--accent)}
  .system-link span:last-child{font-family:var(--mono);font-size:max(14px,.72vw);line-height:1.3}

  /* 不等高柱状 KPI 塔 (参考图 6) */
  .bar-towers{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:1.2vw;flex:1;align-items:end;margin-top:auto;
    border-bottom:1px solid var(--border-strong)
  }
  .bar-tower{
    display:flex;flex-direction:column;justify-content:flex-end;
    min-height:0;height:100%
  }
  .bar-tower .cap{
    background:var(--grey-1);
    height:5.6vh;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:.4vh;border-radius:var(--radius-sm)
  }
  .bar-tower .cap svg{width:1.6vw;height:1.6vw;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .bar-tower .body-block{
    flex:0 1 auto;
    padding:2vh 1.2vw 2vh;
    display:flex;flex-direction:column;justify-content:flex-end;
    min-height:18vh;border-radius:var(--radius-sm) var(--radius-sm) 0 0
  }
  .bar-tower .body-block.h-1{min-height:22vh}
  .bar-tower .body-block.h-2{min-height:30vh}
  .bar-tower .body-block.h-3{min-height:38vh}
  .bar-tower .body-block.h-4{min-height:46vh}
  /* 默认所有 KPI 塔统一为浅描边卡 — 不抢戏;只有 .b-accent 突出为黑色结构块 */
  .bar-tower .body-block{background:var(--paper);color:var(--ink);border:1px solid var(--grey-2)}
  .bar-tower .body-block.b-accent{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
  .bar-tower .lbl{font-family:var(--mono);font-size:max(14px,.82vw);letter-spacing:normal;text-transform:none;opacity:.65;margin-bottom:1vh}
  .bar-tower .nb{font-family:var(--sans);font-weight:var(--weight-emphasis);font-size:max(20px,2.8vw);line-height:1;letter-spacing:-.03em;font-feature-settings:"tnum"}
  .bar-tower .body-block.b-accent .nb{font-weight:700}
  .bar-tower .nb .unit{display:inline-block;font-size:.36em;font-weight:var(--weight-label);line-height:1;opacity:var(--unit-mark-opacity);margin-left:var(--unit-mark-gap);vertical-align:text-top}
  .bar-tower .sub{font-family:var(--sans),var(--sans-zh);font-size:max(16px,.92vw);opacity:.75;margin-top:1.2vh;line-height:1.5}
  .bar-tower .cap{background:var(--grey-1);color:var(--ink)}
  .bar-tower .material-symbols-outlined{font-size:1.6vw}

  /* ============ Carbon Productive Type Tokens ============
     用于 PPT 中的"productive 时刻": 列表、表格行、说明文、章节标签
     固定 px 字号,密集紧凑;与 vw-based 的 Expressive 巨字形成双极对比 */

  /* category label / eyebrow / section tag — small, bold, uppercase */
  .t-cat{
    font-family:var(--mono);
    font-size:14px;font-weight:600;
    letter-spacing:normal;text-transform:none;
    color:var(--text-helper);line-height:1.3
  }
  .t-cat.accent{color:var(--accent)}
  .t-cat.on-dark{color:rgba(255,255,255,.78)}

  /* page chrome / breadcrumb / running header — extra-small mono */
  .t-meta{
    font-family:var(--mono);
    font-size:14px;font-weight:500;
    letter-spacing:normal;text-transform:none;
    color:var(--text-helper);line-height:1.45
  }

  /* helper / caption — secondary text */
  .t-helper{
    font-family:var(--sans),var(--sans-zh);
    font-size:14px;font-weight:400;
    color:var(--text-helper);line-height:1.5;
    letter-spacing:.005em
  }

  /* body small — list items, table rows, captions */
  .t-body-sm{
    font-family:var(--sans),var(--sans-zh);
    font-size:16px;font-weight:400;
    color:var(--text-secondary);line-height:1.55;
    letter-spacing:0
  }

  /* body — paragraphs, descriptions */
  .t-body{
    font-family:var(--sans),var(--sans-zh);
    font-size:18px;font-weight:400;
    color:var(--text-primary);line-height:1.5;
    letter-spacing:-.005em
  }

  /* body emphasis — 强调正文 */
  .t-body-emp{
    font-family:var(--sans),var(--sans-zh);
    font-size:18px;font-weight:600;       /* SemiBold per Carbon */
    color:var(--text-primary);line-height:1.5;
    letter-spacing:-.005em
  }

  /* productive heading — section title within slide */
  .t-h-prod{
    font-family:var(--sans),var(--sans-zh);
    font-size:22px;font-weight:600;
    color:var(--text-primary);line-height:1.4;
    letter-spacing:-.01em
  }

  /* dark background variants */
  .slide.dark .t-cat,.slide.dark .t-meta,.slide.dark .t-helper{color:rgba(255,255,255,.62)}
  .slide.dark .t-body-sm{color:rgba(255,255,255,.78)}
  .slide.dark .t-body,.slide.dark .t-body-emp,.slide.dark .t-h-prod{color:var(--paper)}

  /* ========== V3: 几何水平柱状图 ========== */
  /* 横向柱图: 标签列 + 柱体列 + 数值列 — 严格 XREAL Style 网格 */
  .h-bar-chart{
    display:grid;
    grid-template-columns:max-content minmax(0,1fr) minmax(4em,5.5em);
    gap:1.2vh 1.2vw;
    align-items:center;
    margin-top:2.4vh;
    font-feature-settings:"tnum"
  }
  .h-bar-chart .row-lbl{
    font-family:var(--sans),var(--sans-zh);
    font-weight:500;
    font-size:max(14px,1vw);
    letter-spacing:-.005em;
    text-align:left;max-width:10em
  }
  .h-bar-chart .row-track{
    height:max(24px,2.8vh);
    background:var(--chart-track);
    position:relative;
    overflow:hidden;
    border-radius:var(--radius-sm)
  }
  .h-bar-chart .row-fill{
    display:block;width:var(--value);height:100%;min-width:2px;
    background:var(--chart-series-1);
    transform-origin:left center;
    border-radius:var(--radius-sm)
  }
  .h-bar-chart .row-fill.accent{background:var(--chart-series-1)}
  .h-bar-chart .row-fill.grey,.h-bar-chart .row-fill.series-2{background:var(--chart-series-2)}
  .h-bar-chart .row-fill.critical{background:var(--chart-critical)}
  .h-bar-chart .row-val{
    font-family:var(--sans);font-weight:var(--weight-emphasis);
    font-size:max(16px,1.5vw);
    letter-spacing:-.02em;
    line-height:1
  }
  .h-bar-chart .row-val.critical{color:var(--chart-critical)}
  .h-bar-chart .row-val .unit{
    font-size:.5em;opacity:var(--unit-mark-opacity);font-weight:var(--weight-label);
    margin-left:var(--unit-mark-gap);letter-spacing:.04em;vertical-align:text-top
  }

  /* 垂直柱图: 用于 KPI 对比页(章节 P8) */
  .v-bar-chart{
    display:grid;
    grid-template-columns:repeat(var(--cols,4),1fr);
    align-items:end;
    gap:1.4vw;
    height:50vh;
    margin-top:3vh
  }
  .v-bar-chart .col{display:flex;flex-direction:column;gap:1.4vh;align-items:stretch;height:100%}
  .v-bar-chart .col-bar{
    flex:1 1 auto;
    background:var(--grey-1);
    border-top:2px solid var(--ink);
    position:relative;
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:1vh;
    border-radius:var(--radius-sm) var(--radius-sm) 0 0
  }
  .v-bar-chart .col-bar.accent{background:var(--accent);border-top-color:var(--accent);color:var(--accent-on)}
  .v-bar-chart .col-bar.ink{background:var(--ink);color:var(--paper);border-top-color:var(--ink)}
  .v-bar-chart .col-bar .v{
    font-family:var(--sans);font-weight:var(--weight-emphasis);
    font-size:max(18px,1.6vw);letter-spacing:-.02em
  }
  .v-bar-chart .col-lbl{
    font-family:var(--mono);font-size:max(14px,.78vw);
    letter-spacing:normal;text-transform:none;opacity:.6;
    text-align:center;flex:0 0 auto
  }

  /* XREAL Pie: SVG 只承载扇形几何，标签与数值全部使用 HTML */
  .xreal-pie-layout{
    display:grid;grid-template-columns:minmax(280px,5fr) minmax(320px,7fr);
    gap:5vw;align-items:center;flex:1;min-height:0
  }
  .xreal-pie{display:block;width:min(31vw,48vh);height:auto;justify-self:center}
  .xreal-pie .segment{stroke:var(--paper);stroke-width:2}
  .xreal-pie .segment.critical{fill:var(--brand-red)}
  .xreal-pie .segment.ink{fill:var(--ink)}
  .xreal-pie .segment.grey{fill:var(--grey-3)}
  .xreal-pie .segment.silver{fill:var(--brand-silver)}
  .xreal-pie-legend{display:flex;flex-direction:column;border-top:1px solid var(--border-strong)}
  .xreal-pie-item{
    display:grid;grid-template-columns:12px minmax(0,1fr) auto;
    gap:1vw;align-items:baseline;padding:1.6vh 0;border-bottom:1px solid var(--border-subtle)
  }
  .xreal-pie-item .swatch{width:10px;height:10px;background:var(--ink)}
  .xreal-pie-item.critical .swatch{background:var(--brand-red)}
  .xreal-pie-item.grey .swatch{background:var(--grey-3)}
  .xreal-pie-item.silver .swatch{background:var(--brand-silver)}
  .xreal-pie-item .label{font-size:max(16px,1vw);font-weight:500}
  .xreal-pie-item .value{font-size:max(18px,1.55vw);font-weight:var(--weight-emphasis);font-feature-settings:"tnum"}

  /* S23 Data Chart + S24 Line Chart: 图表占主导面积，标签全部使用 HTML */
  .xreal-data-chart,.xreal-line-chart{
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.5vh;
    flex:1;min-height:0;margin-top:max(48px,5.4vh);
    padding-bottom:calc(var(--nav-safe-bottom) * .4);font-feature-settings:"tnum"
  }
  .chart-meta-row,.chart-foot{
    display:flex;justify-content:space-between;align-items:center;gap:2vw;
    font-family:var(--deck-font);font-size:max(14px,.82vw);color:var(--text-helper)
  }
  .chart-legend{display:flex;align-items:center;justify-content:flex-end;gap:1.4vw;flex-wrap:wrap}
  .chart-legend-item{display:inline-flex;align-items:center;gap:.5vw;white-space:nowrap}
  .chart-swatch{display:inline-block;width:10px;height:10px;background:var(--chart-series-1);flex:0 0 auto}
  .chart-swatch.series-2{background:var(--chart-series-2)}
  .chart-swatch.series-3{background:var(--chart-series-3)}
  .chart-swatch.series-4{background:var(--chart-series-4)}
  .chart-swatch.critical{background:var(--chart-critical)}
  .chart-stage,.line-stage{
    display:grid;grid-template-columns:minmax(44px,4.2vw) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;column-gap:1vw;row-gap:1vh;min-height:42vh
  }
  .chart-y-labels{
    grid-column:1;grid-row:1;display:grid;grid-template-rows:repeat(5,1fr);
    align-items:start;text-align:right;padding-right:.2vw;
    font-family:var(--deck-font);font-size:max(14px,.72vw);color:var(--text-helper)
  }
  .chart-y-labels span:last-child{align-self:end}
  .chart-plot,.line-plot{
    grid-column:2;grid-row:1;position:relative;min-height:0;
    box-sizing:border-box;border:1px solid var(--chart-frame)
  }
  .chart-grid{
    position:absolute;inset:0;display:grid;grid-template-rows:repeat(4,1fr) auto;
    pointer-events:none
  }
  .chart-grid i{display:block;border-top:1px solid var(--chart-grid)}
  .chart-grid i:first-child,.chart-grid i:last-child{border-top:0}
  .chart-groups{
    position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--groups),minmax(0,1fr));
    gap:1.2vw;align-items:stretch;padding:var(--chart-value-headroom) var(--chart-safe-inline) 0
  }
  .chart-group{
    display:grid;grid-template-columns:repeat(var(--series-count),minmax(0,1fr));
    gap:.35vw;align-items:end;min-width:0
  }
  .chart-bar{
    position:relative;height:calc(var(--value) * 1%);min-height:2px;background:var(--chart-series-1);
    transform-origin:bottom center;border-radius:var(--radius-sm) var(--radius-sm) 0 0
  }
  .chart-bar.series-2{background:var(--chart-series-2)}
  .chart-bar.series-3{background:var(--chart-series-3)}
  .chart-bar.series-4{background:var(--chart-series-4)}
  .chart-bar.critical{background:var(--chart-critical)}
  .chart-value{
    position:absolute;left:0;right:0;bottom:calc(100% + .5vh);text-align:center;
    font-family:var(--deck-font);font-size:max(14px,.76vw);font-weight:var(--weight-label);
    color:var(--text-primary);white-space:nowrap
  }
  .chart-x-labels,.line-x-labels{
    grid-column:2;grid-row:2;text-align:center;
    font-family:var(--deck-font);font-size:max(14px,.76vw);color:var(--text-helper)
  }
  .chart-x-labels{display:grid;grid-template-columns:repeat(var(--groups),minmax(0,1fr));padding-inline:var(--chart-safe-inline)}
  .line-x-labels{display:flex;justify-content:space-between;padding-inline:var(--line-chart-safe-inline)}
  .chart-foot{border-top:1px solid var(--border-subtle);padding-top:1.2vh;align-items:flex-start}
  .chart-source{max-width:58%}
  .chart-note{max-width:38%;text-align:right;color:var(--text-secondary)}
  .line-geometry{position:absolute;inset:0 var(--line-chart-safe-inline)}
  .line-chart-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .chart-line{
    fill:none;stroke:var(--chart-series-1);stroke-width:3;vector-effect:non-scaling-stroke;
    stroke-linejoin:round;stroke-linecap:square
  }
  .chart-line.series-2{stroke:var(--chart-series-2);stroke-dasharray:10 7}
  .chart-line.series-3{stroke:var(--chart-series-3);stroke-dasharray:3 6}
  .chart-line.critical{stroke:var(--chart-critical)}
  .chart-point{fill:var(--paper);stroke:var(--chart-series-1);stroke-width:2;vector-effect:non-scaling-stroke}
  .chart-point.series-2{stroke:var(--chart-series-2)}
  .chart-point.series-3{stroke:var(--chart-series-3)}
  .chart-point.critical{fill:var(--chart-critical);stroke:var(--chart-critical)}
  .line-end-label{
    position:absolute;left:clamp(0%,calc(var(--x) * 1%),100%);top:clamp(0%,calc(var(--y) * 1%),100%);
    transform:translate(-100%,-50%);padding-left:.5vw;
    font-family:var(--deck-font);font-size:max(14px,.84vw);font-weight:var(--weight-label);
    color:var(--text-primary);background:var(--paper)
  }
  .line-end-label.series-2{color:var(--text-secondary)}
  .line-end-label.critical{color:var(--chart-critical)}
  .slide.dark .chart-swatch.series-1,.slide.dark .chart-bar.series-1{background:var(--paper)}
  .slide.dark .chart-line.series-1{stroke:var(--paper)}
  .slide.dark .chart-point.series-1{fill:var(--ink);stroke:var(--paper)}
  .slide.dark .line-end-label{background:var(--ink);color:var(--paper)}
  .slide.dark .chart-meta-row,.slide.dark .chart-foot,.slide.dark .chart-y-labels,
  .slide.dark .chart-x-labels,.slide.dark .line-x-labels{color:rgba(255,255,255,.68)}
  .slide.dark .chart-value,.slide.dark .chart-note{color:var(--paper)}
  .slide.dark .chart-plot,.slide.dark .line-plot{border-color:rgba(255,255,255,.5)}
  .slide.dark .chart-grid i{border-top-color:rgba(255,255,255,.18)}

  /* S25 Portfolio Roadmap Matrix: 时间 × 能力层级的二维组合路线，不使用 dashboard tabs 或彩色泳道。 */
  .portfolio-roadmap{
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.1vh;
    flex:1;min-height:0;margin-top:3.6vh;font-feature-settings:"tnum"
  }
  .roadmap-year-axis,.roadmap-body{display:grid;grid-template-columns:minmax(64px,4.6vw) minmax(0,1fr);gap:1vw}
  .roadmap-periods{display:grid;grid-template-columns:repeat(var(--periods),minmax(0,1fr));border-bottom:1px solid var(--border-strong)}
  .roadmap-period{padding:0 0 .8vh;text-align:center;font-size:max(14px,.82vw);font-weight:var(--weight-label);color:var(--text-helper)}
  .roadmap-y-axis{display:grid;grid-template-rows:repeat(var(--lanes),minmax(0,1fr));text-align:right}
  .roadmap-y-axis span{display:flex;align-items:center;justify-content:flex-start;text-align:left;white-space:nowrap;font-size:max(14px,.78vw);line-height:1.25;color:var(--text-helper)}
  .roadmap-plot{position:relative;min-height:0;border:1px solid var(--border-strong);overflow:hidden;background:var(--paper)}
  .roadmap-lanes{position:absolute;inset:0;display:grid;grid-template-rows:repeat(var(--lanes),minmax(0,1fr))}
  .roadmap-lane{background:var(--paper);border-bottom:1px solid var(--border-subtle)}
  .roadmap-lane:nth-child(even){background:var(--grey-1)}
  .roadmap-lane:last-child{border-bottom:0}
  .roadmap-period-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--periods),minmax(0,1fr));pointer-events:none}
  .roadmap-period-grid i{border-left:1px solid var(--border-subtle)}
  .roadmap-period-grid i:first-child{border-left:0}
  .roadmap-item{
    position:absolute;left:calc(var(--x) * 1%);top:calc(var(--y) * 1%);width:calc(var(--w) * 1%);height:calc(var(--h) * 1%);
    display:grid;grid-template-columns:minmax(64px,42%) minmax(0,1fr);gap:.8vw;align-items:center;
    padding:.8vh .7vw;background:var(--paper);border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden
  }
  .roadmap-item.critical{border-top-color:var(--chart-critical);border-top-width:2px}
  .roadmap-media{display:block;width:100%;height:100%;min-height:0;object-fit:cover;border-radius:var(--radius-sm);background:var(--grey-1)}
  .roadmap-media[data-media-fit="contain"]{object-fit:contain}
  .roadmap-copy{min-width:0;display:flex;flex-direction:column;gap:.45vh}
  .roadmap-title{font-size:max(16px,1vw);font-weight:var(--weight-title);line-height:1.08}
  .roadmap-meta{font-size:max(13px,.7vw);line-height:1.3;color:var(--text-secondary)}
  .roadmap-source,.milestone-source,.dense-source{font-size:max(14px,.72vw);line-height:1.35;color:var(--text-helper);border-top:1px solid var(--border-subtle);padding-top:.9vh}

  /* S26 Milestone Gallery: 连续年份卡片 + 媒体证据 + 底部综合链。 */
  .milestone-gallery{
    display:grid;grid-template-columns:var(--milestone-columns,repeat(4,minmax(0,1fr)));
    gap:1vw;flex:1;min-height:0;margin-top:3.6vh
  }
  .milestone-entry{min-width:0;padding:1.4vh;background:var(--grey-1);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,23vh) auto 1fr;gap:1.6vh}
  .milestone-year{font-size:max(16px,1.3vw);font-weight:var(--weight-emphasis);line-height:1;color:var(--text-helper)}
  .milestone-media{display:block;width:100%;height:100%;min-height:12vh;object-fit:cover;border-radius:var(--radius-sm);background:var(--paper)}
  .milestone-media[data-media-fit="contain"]{object-fit:contain}
  .milestone-title{font-size:max(18px,1.25vw);font-weight:var(--weight-title);line-height:1.08}
  .milestone-copy{font-size:max(14px,.78vw);line-height:1.38;color:var(--text-secondary)}
  .milestone-synthesis{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:3vw;align-items:end;padding-top:1.5vh}
  .milestone-synthesis-copy{font-size:max(16px,.94vw);line-height:1.42;font-weight:var(--weight-label);max-width:58ch}
  .milestone-chain{display:flex;align-items:flex-start;justify-content:flex-end;gap:1.2vw}
  .milestone-chain-step{position:relative;min-width:0;padding-top:.8vh;border-top:1px solid var(--ink);font-size:max(13px,.72vw);line-height:1.2;color:var(--text-secondary);white-space:nowrap}
  .milestone-chain-step:not(:last-child)::after{content:"→";position:absolute;left:calc(100% + .35vw);top:.55vh;color:var(--text-helper)}

  /* S27 Dense Synthesis: 同页保留相互依赖的大量信息；以三组并行结构组织，不做 dashboard。 */
  .dense-synthesis{
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.2vh;
    flex:1;min-height:0;margin-top:3.6vh
  }
  .dense-thesis{
    display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.2vw;align-items:start;
    padding:1.4vh 1.2vw;background:var(--ink);color:var(--paper);
    border:1px solid var(--ink);border-radius:var(--radius-sm)
  }
  .dense-thesis-label{font-size:max(14px,.76vw);font-weight:var(--weight-label);line-height:1.35;color:rgba(255,255,255,.62);white-space:nowrap}
  .dense-thesis-copy{font-size:max(18px,1vw);font-weight:var(--weight-label);line-height:1.42;max-width:92ch}
  .dense-columns{display:grid;grid-template-columns:var(--dense-columns,1.08fr 1fr 1.16fr);gap:1vw;min-height:0}
  .dense-panel{
    min-width:0;min-height:0;overflow:hidden;padding:var(--sp-5);
    display:grid;grid-template-rows:auto minmax(0,1fr);gap:1.6vh;
    background:var(--paper);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:none
  }
  .dense-panel-title{font-size:max(20px,1.3vw);font-weight:var(--weight-title);line-height:1.12;letter-spacing:-.015em}
  .dense-panel-body{min-height:0;display:grid;align-content:stretch}
  .dense-item{min-width:0;padding:1.15vh 0;border-top:1px solid var(--border-subtle)}
  .dense-item:first-child{border-top-color:var(--border-strong)}
  .dense-item-kicker{display:block;font-size:max(14px,.72vw);font-weight:var(--weight-label);line-height:1.25;color:var(--text-helper);margin-bottom:.55vh}
  .dense-item-title{display:block;font-size:max(17px,.98vw);font-weight:var(--weight-title);line-height:1.18}
  .dense-item-copy{font-size:max(16px,.82vw);line-height:1.4;color:var(--text-secondary);margin-top:.55vh}
  .dense-comparison{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9vw;height:100%}
  .dense-comparison .dense-item{display:flex;flex-direction:column;justify-content:space-between;padding-inline:.1vw}
  .dense-stage-mark{font-size:max(24px,1.8vw);font-weight:var(--weight-emphasis);line-height:1;letter-spacing:-.03em}
  .dense-progression,.dense-feature-list{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));height:100%}
  .dense-progression .dense-item{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.8vw;align-content:center}
  .dense-progress-num{font-size:max(14px,.72vw);font-weight:var(--weight-label);line-height:1.25;color:var(--text-helper)}
  .dense-progression .dense-item-copy{grid-column:2}
  .dense-item.is-focus{
    position:relative;isolation:isolate;overflow:hidden;margin:.7vh 0;padding:1.15vh .9vw;border:0;border-radius:var(--radius-sm);
    grid-template-columns:auto minmax(0,1fr);background:var(--ink);color:var(--paper)
  }
  .dense-item.is-focus::after{content:"";position:absolute;inset:0;z-index:1;background:rgba(0,0,0,.34);pointer-events:none}
  .dense-item.is-focus > :not(.dense-media){position:relative;z-index:2}
  .dense-item.is-focus .dense-progress-num,.dense-item.is-focus .dense-item-copy{color:rgba(255,255,255,.66)}
  .dense-media{position:absolute;inset:-42% -8% -24% 24%;z-index:0;width:84%;height:166%;object-fit:cover;object-position:center 60%;filter:brightness(1.08) saturate(.78)}
  .dense-feature{display:grid;grid-template-columns:minmax(28px,2vw) minmax(0,1fr);column-gap:.8vw;align-content:center}
  .dense-feature-icon{font-family:"Material Symbols Outlined";font-size:max(24px,1.55vw);font-weight:400;line-height:1;color:var(--ink)}
  .dense-feature .dense-item-copy{grid-column:2}

  /* XREAL ECharts 扩展：复杂图表使用现有版式骨架，不生成 dashboard 容器 */
  .xreal-echart-stage{
    position:relative;flex:1;min-height:0;margin-top:2.4vh;
    border-top:1px solid var(--border-strong)
  }
  .xreal-echart{
    position:absolute;inset:1.8vh 0 0;min-width:0;min-height:0;
    background:transparent
  }
  .xreal-echart[data-echarts-state="loading"]::before,
  .xreal-echart[data-echarts-state="error"]::before{
    content:attr(data-echarts-message);position:absolute;inset:0;display:grid;place-items:center;
    font-family:var(--deck-font);font-size:max(14px,.78vw);color:var(--text-helper);
    border:1px solid var(--border-subtle)
  }
  .slide.dark .xreal-echart-stage{border-top-color:rgba(255,255,255,.5)}

<script>
/* =============== XREAL ECharts · 复杂图表受控运行时 =============== */
(function(){
  const LOCAL_SRC = './assets/echarts.min.js';
  const ALLOWED_TYPES = new Set(['bar','line','scatter','boxplot','heatmap','candlestick','sankey','graph','tree','treemap']);
  const instances = new Map();
  let libraryPromise = null;
  let themesRegistered = false;

  window.XREAL_ECHARTS_OPTIONS = window.XREAL_ECHARTS_OPTIONS || {};

  const readCss = (name, fallback) => {
    const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return value || fallback;
  };
  const fontFamily = () => getComputedStyle(document.documentElement).getPropertyValue('--deck-font').trim()
    || (document.documentElement.lang.startsWith('zh') ? 'IBM Plex Sans SC, sans-serif' : 'XREAL Diatype, Arial, sans-serif');
  const isDarkSlide = slide => slide.classList.contains('dark') || slide.classList.contains('accent');
  const palette = dark => ({
    paper: dark ? readCss('--ink','#0a0a0a') : readCss('--paper','#ffffff'),
    text: dark ? readCss('--paper','#ffffff') : readCss('--ink','#0a0a0a'),
    secondary: dark ? '#c6c6c6' : readCss('--chart-series-2','#525252'),
    helper: dark ? '#8d8d8d' : readCss('--chart-series-3','#a3a3a3'),
    faint: dark ? '#525252' : readCss('--grey-1','#f4f4f4'),
    silver: readCss('--chart-series-4','#d6dade'),
    red: readCss('--chart-critical','#d71920'),
  });

  function loadLibrary(){
    if(window.echarts) return Promise.resolve(window.echarts);
    if(libraryPromise) return libraryPromise;
    libraryPromise = new Promise((resolve, reject)=>{
      const script = document.createElement('script');
      script.src = LOCAL_SRC;
      script.dataset.xrealEchartsLoader = 'local';
      script.onload = ()=>window.echarts ? resolve(window.echarts) : reject(new Error('ECharts loaded without a global API.'));
      script.onerror = ()=>reject(new Error('Missing assets/echarts.min.js. Run scripts/prepare-echarts.mjs or inline-echarts.mjs.'));
      document.head.appendChild(script);
    });
    return libraryPromise;
  }

  function registerThemes(echarts){
    if(themesRegistered) return;
    const makeTheme = dark => {
      const p = palette(dark);
      const axis = {
        axisLine:{lineStyle:{color:p.secondary,width:1}},
        axisTick:{show:false},
        axisLabel:{color:p.secondary,fontFamily:fontFamily(),fontSize:13,margin:12},
        splitLine:{show:true,lineStyle:{color:p.helper,width:1,opacity:dark?.28:.42}},
        nameTextStyle:{color:p.secondary,fontFamily:fontFamily(),fontSize:13},
      };
      return {
        backgroundColor:'transparent',
        color:[p.text,p.secondary,p.helper,p.silver],
        textStyle:{color:p.text,fontFamily:fontFamily(),fontSize:14,fontWeight:400},
        categoryAxis:axis,valueAxis:axis,timeAxis:axis,logAxis:axis,
      };

    echarts.registerTheme('xreal-dark',makeTheme(true));

  function assertSafeOption(option){
    const forbiddenKeys = new Set(['shadowBlur','shadowColor','shadowOffsetX','shadowOffsetY','decal']);
    let criticalMarks = 0;
    const walk = (value, path='option') => {
      if(!value || typeof value !== 'object') return;
      if(Array.isArray(value)){ value.forEach((item,index)=>walk(item,`${path}[${index}]`)); return; }
      for(const [key,child] of Object.entries(value)){
        if(forbiddenKeys.has(key) && child) throw new Error(`${path}.${key} is forbidden by XREAL Style.`);
        if(key === 'colorStops') throw new Error(`${path}.colorStops is forbidden; use solid colors or a piecewise visualMap.`);
        if(key === 'areaStyle' && child && Object.keys(child).length) throw new Error(`${path}.areaStyle is forbidden; XREAL line charts do not use filled areas.`);
        walk(child,`${path}.${key}`);

    const series = Array.isArray(option.series) ? option.series : option.series ? [option.series] : [];
    series.forEach((item,index)=>{
      if(!ALLOWED_TYPES.has(item.type)) throw new Error(`series[${index}].type=${item.type || '(missing)'} is not registered for XREAL ECharts.`);
      if(item.xrealCritical) criticalMarks += 1;
      const data = Array.isArray(item.data) ? item.data : [];
      data.forEach(datum=>{if(datum && typeof datum === 'object' && !Array.isArray(datum) && datum.xrealCritical) criticalMarks += 1;});
    });
    if(criticalMarks > 1) throw new Error('Only one ECharts series or data item may use xrealCritical:true.');
    const maps = Array.isArray(option.visualMap) ? option.visualMap : option.visualMap ? [option.visualMap] : [];

    if(axis === undefined) return axis;
    const list = Array.isArray(axis) ? axis : [axis];
    const normalized = list.map(item=>({
      ...item,
      axisLine:{show:true,...item.axisLine,lineStyle:{color:p.secondary,width:1,...item.axisLine?.lineStyle}},
      axisTick:{show:false,...item.axisTick},
      axisLabel:{color:p.secondary,fontFamily:fontFamily(),fontSize:13,margin:12,...item.axisLabel},
      splitLine:{show:!isCategory,...item.splitLine,lineStyle:{color:p.helper,width:1,opacity:.42,...item.splitLine?.lineStyle}},
      nameTextStyle:{color:p.secondary,fontFamily:fontFamily(),fontSize:13,...item.nameTextStyle},
      nameLocation:item.name ? 'middle' : item.nameLocation,
      nameGap:item.name ? (axisRole === 'y' ? 48 : 34) : item.nameGap,
    }));
